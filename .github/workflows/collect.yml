# Coletor de anúncios (docs/PLANO-COLETA.md, D-26, D-37): todas as fontes de src/sources/index.ts, em paralelo.
# Segredo necessário em Settings → Secrets and variables → Actions: DATABASE_URL (pooler, porta 6543).
name: Coleta

on:
  # Disparo pelo pg_cron do Supabase, de 4 em 4 horas (prisma/sql/cron.sql, D-33). Sem `schedule` próprio
  # para não duplicar execuções na cota mensal do GitHub Actions em repositório privado.
  workflow_dispatch:
    inputs:
      max_visits:
        description: "Máximo de anúncios lidos por fonte nesta execução"
        default: "400"
        required: false

permissions:
  contents: read

# Nunca duas coletas ao mesmo tempo; a próxima espera a atual terminar.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Entrada manual passa por variável de ambiente, nunca interpolada direto no comando.
      MAX_VISITS: ${{ inputs.max_visits || '400' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ">=22.19.0 <23"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run collect -- --max-visits "$MAX_VISITS"
